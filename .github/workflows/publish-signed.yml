name: Publish signed APKs
on:
  push:
    branches: [main]
    paths: ['.release-input/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check signed payload presence
        id: payload
        shell: bash
        run: |
          if [[ -f .release-input/release.json ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.payload.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.payload.outputs.ready == 'true'
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate signed payload
        if: steps.payload.outputs.ready == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-release-payload.py >> "$GITHUB_OUTPUT"
      - name: Report previous publication failure
        if: steps.payload.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          previous=$(python3 -c "import json; print(json.load(open('.release-input/release.json')).get('diagnostic_run',''))")
          if [[ -n "$previous" ]]; then
            [[ "$previous" =~ ^[0-9]+$ ]]
            gh run view "$previous" --log-failed > "$RUNNER_TEMP/previous-publish.txt"
            python3 - <<'PYTHON'
          import os
          from pathlib import Path
          report=(Path(os.environ['RUNNER_TEMP'])/'previous-publish.txt').read_text(errors='replace')[-18000:]
          value=report.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::warning title=Previous publication failure::'+value)
          PYTHON
          fi
      - name: Publish immutable release
        if: steps.payload.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.commit }}
          PREVIEW: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c "import json; raise SystemExit(not bool(json.load(open('.release-input/release.json')).get('diagnostic_only')))"; then
            echo 'Publication paused for diagnostics'
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace signed assets' >&2
            exit 1
          fi
          flags=(--latest)
          if [[ "$PREVIEW" == true ]]; then flags=(--prerelease); fi
          gh release create "$RELEASE_TAG" .release-input/*.apk .release-input/SHA256SUMS.txt .release-input/certificate.sha256 \
            --target "$SOURCE_COMMIT" "${flags[@]}" --title "Luma Music $RELEASE_VERSION" --notes-file .release-input/notes.md
