name: One-time remote branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[CLEANUP_REMOTE_BRANCHES]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete all remote branches except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')
          failed=0
          for branch in "${branches[@]}"; do
            [[ "${branch}" == "main" ]] && continue
            encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "${branch}")"
            if gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded}" >/dev/null; then
              echo "Deleted: ${branch}"
            else
              echo "Could not delete: ${branch}"
              failed=1
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "Some branches could not be deleted; check branch protection and permissions."
            exit 1
          fi
          echo "Remote branch cleanup complete. main was preserved."
