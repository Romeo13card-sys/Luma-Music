name: Desktop release recovery
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag'
        required: true
        type: string
      run_id:
        description: 'Desktop release workflow run to recover'
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag }}
  RECOVERY_RUN_ID: ${{ inputs.run_id }}
permissions:
  contents: write
  actions: read
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified successful archives and inspect failed build logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/recover-desktop-release.py
