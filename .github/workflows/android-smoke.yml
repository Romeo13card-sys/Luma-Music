name: Android release integration
on:
  push:
    branches: [main]
    paths: ['.smoke-input/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  payload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect previous integration failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          previous=$(python3 -c "import json; print(json.load(open('.smoke-input/source.json')).get('diagnostic_run',''))" 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            [[ "$previous" =~ ^[0-9]+$ ]]
            gh run download "$previous" --name Android-release-integration-API-30 --dir "$RUNNER_TEMP/prior-android"
            python3 - <<'PYTHON'
          import os,re
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'prior-android'
          for file in folder.glob('*.txt'):
              lines=file.read_text(errors='replace').splitlines()
              if file.name=='app-log.txt':
                  lines=[line for line in lines if re.search(r'Luma|luma|ActivityTaskManager|AndroidRuntime|PackageManager',line)][-50:]
              elif file.name in ('activity-state.txt','window-state.txt'):
                  lines=[line for line in lines if re.search(r'luma|Resumed|Focus|Task|Hist',line)][-30:]
              value=chr(10).join(lines)[-18000:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
              print('::warning title=Prior '+file.name+'::'+value)
          PYTHON
          fi
      - id: check
        shell: bash
        run: |
          if [[ -f .smoke-input/source.json ]] && python3 -c "import json; raise SystemExit(bool(json.load(open('.smoke-input/source.json')).get('diagnostic_only')))"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
  android:
    needs: payload
    if: needs.payload.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          script: python3 scripts/run-android-integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-release-integration-API-${{ matrix.api }}
          path: android-integration/*
          if-no-files-found: ignore
