name: Luma Music test APK

on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Rust tests and Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'core/Cargo.toml', 'scripts/build-android.sh') }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust core
        run: cargo test --workspace --locked
      - name: Test APK packaging
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "platform-tools"
      - name: Build optimized native libraries and test APKs
        run: bash scripts/build-android.sh
      - name: Android Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug
      - name: Name APKs for distribution
        id: package
        run: python3 scripts/package-apks.py >> "$GITHUB_OUTPUT"
      - name: Verify APK signatures and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          for apk in "${{ steps.package.outputs.directory }}"/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          done
          cd "${{ steps.package.outputs.directory }}"
          sha256sum --check SHA256SUMS.txt
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: luma-music-test-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.directory }}/*.apk
            ${{ steps.package.outputs.directory }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{ github.run_number }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  publish-test-release:
    name: Publish test APKs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified APKs
        uses: actions/download-artifact@v4
        with:
          name: luma-music-test-${{ github.run_number }}
          path: release
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Luma Music — тестовая версия «Жидкое стекло» для Android 11+.
          made by Romeo13card

          Новый экран настроек: вибрация, повтор и перемешивание сохраняются между запусками.

          Для телефона ARM64 выберите Luma-Music-*-arm64-v8a.apk.
          Без аккаунта можно открыть деморежим и локальный тестовый звук.

          Это APK с отладочной подписью. Работа настоящего аккаунта и полный диапазон Android 11–17 ещё не проверены. Для OAuth-входа через браузер нужен собственный Client ID. «Моя волна» и офлайн-загрузка каталога пока не реализованы.
          NOTES
          gh release create "$RELEASE_TAG" release/*.apk release/SHA256SUMS.txt \
            --prerelease --verify-tag --title "Luma Music — Жидкое стекло ($RELEASE_TAG)" \
            --notes-file notes.md
