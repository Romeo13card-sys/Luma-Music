name: Android test APK

on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Rust tests and Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'core/Cargo.toml', 'scripts/build-android.sh') }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust core
        run: cargo test --workspace --locked
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "platform-tools"
      - name: Build optimized native libraries and test APKs
        run: bash scripts/build-android.sh
      - name: Android Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug
      - name: Verify APK signatures and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          done
          cd android/app/build/outputs/apk/debug
          sha256sum ./*.apk > SHA256SUMS.txt
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: music-rust-glass-test-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{ github.run_number }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
