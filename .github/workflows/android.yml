name: Luma Music Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.smoke-input/**'
      - '.release-input/**'
      - '.github/release-request.json'
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Rust tests and Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android
          components: rustfmt
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'core/Cargo.toml', 'scripts/build-android.sh') }}
          restore-keys: rust-android-${{ runner.os }}-
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify pinned YAYMA source and license
        run: python3 scripts/verify-upstream.py
      - name: Test Rust core
        run: cargo test -p yamusic-core --locked
      - name: Test APK packaging
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "platform-tools"
      - name: Configure optional browser OAuth client
        env:
          OAUTH_CLIENT: ${{ vars.LUMA_YANDEX_CLIENT_ID }}
          SPOTIFY_CLIENT: ${{ vars.LUMA_SPOTIFY_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$OAUTH_CLIENT" && ! "$OAUTH_CLIENT" =~ ^[A-Za-z0-9_-]{8,128}$ ]]; then
            echo '::error::Invalid LUMA_YANDEX_CLIENT_ID repository variable'
            exit 1
          fi
          echo "LUMA_YANDEX_CLIENT_ID=$OAUTH_CLIENT" >> "$GITHUB_ENV"
          if [[ -n "$SPOTIFY_CLIENT" && ! "$SPOTIFY_CLIENT" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo '::error::Invalid LUMA_SPOTIFY_CLIENT_ID'
            exit 1
          fi
          echo "LUMA_SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT" >> "$GITHUB_ENV"
      - name: Build optimized native libraries and unsigned release APKs
        run: bash scripts/build-android.sh
      - name: Android unit tests and Lint
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease
      - name: Name APKs for distribution
        id: package
        run: python3 scripts/package-apks.py >> "$GITHUB_OUTPUT"
      - name: Verify unsigned APKs and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          for apk in "${{ steps.package.outputs.directory }}"/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          done
          cd "${{ steps.package.outputs.directory }}"
          sha256sum --check SHA256SUMS.txt
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: luma-music-unsigned-apks-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.directory }}/*.apk
            ${{ steps.package.outputs.directory }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{ github.run_number }}
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
