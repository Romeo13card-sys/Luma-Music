name: One-time Rust formatting
on:
  push:
    branches: [main]
    paths:
      - '.github/format-rust-once'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Format Rust workspace and commit changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- '*.rs'; then
            echo "Rust sources already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: format Rust sources"
          git push origin HEAD:main
